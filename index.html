<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voxel English Quiz Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Name Tag */
        #name-tag {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        /* Modal animations */
        .modal-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-orange-400">

    <div id="game-container"></div>

    <div id="ui-layer">
        
        <div id="name-tag">Player</div>

        <div id="hud" class="hidden absolute top-4 left-4 right-4 flex justify-between pointer-events-auto">
            <div class="bg-gray-900/80 text-white px-4 py-2 rounded-lg border-2 border-gray-700 shadow-lg flex gap-4">
                <div class="text-lg font-bold text-orange-400">Score: <span id="score-display">0</span></div>
                <div class="text-lg font-bold text-yellow-400">⭐ <span id="stars-display">0</span>/10</div>
            </div>
            <button id="btn-home" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold shadow-lg border-2 border-red-700 transition">
                🏠 Home
            </button>
        </div>

        <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm pointer-events-auto">
            <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-orange-500 modal-enter">
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Voxel Quest</h1>
                <p class="text-gray-600 mb-6">Learn English & Survive!</p>
                <input type="text" id="input-name" placeholder="Enter your name" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-orange-500 outline-none mb-4 text-center font-bold text-lg" maxlength="12">
                <button id="btn-start" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg text-xl shadow-lg transition transform hover:scale-105 active:scale-95">
                    ▶ Play Now
                </button>
            </div>
        </div>

        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-red-900/80 backdrop-blur-sm pointer-events-auto">
            <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-red-600 modal-enter">
                <h1 id="end-title" class="text-4xl font-extrabold text-red-600 mb-4">Caught!</h1>
                <div class="bg-gray-100 p-4 rounded-lg mb-6">
                    <p class="text-gray-700 font-bold text-lg">Final Score: <span id="end-score" class="text-orange-600">0</span></p>
                    <p class="text-gray-700 font-bold text-lg">Stars Earned: <span id="end-stars" class="text-yellow-500">0</span>/10</p>
                </div>
                <button id="btn-restart" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-xl shadow-lg transition transform hover:scale-105 active:scale-95">
                    🔄 Play Again
                </button>
            </div>
        </div>

        <div id="quiz-modal" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 backdrop-blur-md pointer-events-auto">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full border-4 border-yellow-400 modal-enter">
                <div class="text-center mb-6">
                    <div class="inline-block bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-bold text-sm mb-2">Question Time!</div>
                    <h2 id="quiz-question" class="text-2xl font-bold text-gray-800">What is the synonym of "Fast"?</h2>
                </div>
                <div id="quiz-choices" class="grid grid-cols-1 gap-3">
                    </div>
                <div id="quiz-feedback" class="hidden mt-4 text-center font-bold text-xl h-8"></div>
            </div>
        </div>

        <div id="home-modal" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 backdrop-blur-sm pointer-events-auto">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-gray-800 modal-enter">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Give up?</h2>
                <p class="text-gray-600 mb-6">Your current score and stars will be saved to the final screen.</p>
                <div class="flex gap-4">
                    <button id="btn-home-yes" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg transition">Yes, Quit</button>
                    <button id="btn-home-no" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded-lg transition">No, Resume</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Web Audio API (Synthesizer)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            start: () => { playTone(440, 'sine', 0.1); setTimeout(() => playTone(660, 'sine', 0.2), 100); },
            score: () => { playTone(880, 'square', 0.1, 0.05); },
            question: () => { playTone(500, 'triangle', 0.3); },
            correct: () => { playTone(1000, 'sine', 0.1); setTimeout(() => playTone(1500, 'sine', 0.3), 100); },
            wrong: () => { playTone(300, 'sawtooth', 0.3); setTimeout(() => playTone(200, 'sawtooth', 0.4), 200); },
            gameover: () => { playTone(150, 'sawtooth', 0.8, 0.2); }
        };

        // ==========================================
        // 2. Quiz Data (English Subject)
        // ==========================================
        const questionBank = [
            { q: "Which word is a noun?", choices: ["Apple", "Run", "Quickly", "Beautiful"], answer: 0 },
            { q: "What is the synonym of 'Fast'?", choices: ["Slow", "Quick", "Heavy", "Soft"], answer: 1 },
            { q: "Choose the correct verb: She ___ to school.", choices: ["go", "going", "goes", "gone"], answer: 2 },
            { q: "Which one is a color?", choices: ["Table", "Purple", "Happy", "Jump"], answer: 1 },
            { q: "What is the opposite of 'Cold'?", choices: ["Freezing", "Cool", "Warm", "Hot"], answer: 3 },
            { q: "A dog is an ___.", choices: ["Animal", "Object", "Plant", "Insect"], answer: 0 },
            { q: "I ___ a book right now.", choices: ["read", "reads", "am reading", "reading"], answer: 2 },
            { q: "Which is a fruit?", choices: ["Carrot", "Potato", "Banana", "Onion"], answer: 2 },
            { q: "Plural form of 'Child' is ___.", choices: ["Childs", "Children", "Childrens", "Childes"], answer: 1 },
            { q: "Where do you sleep?", choices: ["Kitchen", "Bathroom", "Bedroom", "Garage"], answer: 2 }
        ];
        let currentQuestion = null;

        // ==========================================
        // 3. Game State & Variables
        // ==========================================
        let gameState = 'start'; // start, playing, paused, gameover
        let score = 0;
        let stars = 0;
        let playerName = "Player";
        
        let moveState = { forward: false, backward: false, left: false, right: false };
        let targetPosition = null; // For touch/mouse movement

        // Arrays for entities
        let enemies = [];
        let scoreBoxes = [];
        let questionBoxes = [];

        // ==========================================
        // 4. Three.js Setup
        // ==========================================
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        
        // Theme: Sunset & Fog
        const skyColor = 0xff8c00; 
        scene.background = new THREE.Color(skyColor);
        scene.fog = new THREE.Fog(skyColor, 15, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffd700, 0.8); // Golden hour light
        dirLight.position.set(-10, 20, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 }); // Green ground
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Raycaster for touch/mouse
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        // ==========================================
        // 5. Environment Generation
        // ==========================================
        const envGroup = new THREE.Group();
        scene.add(envGroup);

        function createTree(x, z) {
            const trunkGeo = new THREE.BoxGeometry(1, 2, 1);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 1, z);
            trunk.castShadow = true;
            
            const leavesGeo = new THREE.BoxGeometry(3, 3, 3);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 3.5, z);
            leaves.castShadow = true;
            
            envGroup.add(trunk);
            envGroup.add(leaves);
        }

        function createBuilding(x, z) {
            const height = Math.random() * 5 + 3;
            const geo = new THREE.BoxGeometry(3, height, 3);
            const mat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x3e2723 : 0x212121 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height / 2, z);
            mesh.castShadow = true;
            envGroup.add(mesh);
        }

        function generateEnvironment() {
            // Clear old env
            while(envGroup.children.length > 0){ 
                envGroup.remove(envGroup.children[0]); 
            }
            // Generate random trees and buildings, avoiding center (0,0)
            for(let i=0; i<60; i++) {
                let x = (Math.random() - 0.5) * 100;
                let z = (Math.random() - 0.5) * 100;
                if(Math.abs(x) < 5 && Math.abs(z) < 5) continue; // Safe zone
                
                if(Math.random() > 0.4) createTree(x, z);
                else createBuilding(x, z);
            }
        }

        // ==========================================
        // 6. Player Setup (Voxel Human)
        // ==========================================
        const player = new THREE.Group();
        scene.add(player);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x1e88e5 });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x1565c0 });

        // Body
        const bodyGeo = new THREE.BoxGeometry(1, 1.2, 0.5);
        const body = new THREE.Mesh(bodyGeo, shirtMat);
        body.position.y = 1.6;
        body.castShadow = true;
        player.add(body);

        // Head
        const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 2.6;
        head.castShadow = true;
        player.add(head);

        // Limbs
        const limbGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
        
        const armL = new THREE.Mesh(limbGeo, skinMat);
        armL.position.set(0.7, 1.6, 0);
        armL.castShadow = true;
        player.add(armL);

        const armR = new THREE.Mesh(limbGeo, skinMat);
        armR.position.set(-0.7, 1.6, 0);
        armR.castShadow = true;
        player.add(armR);

        const legL = new THREE.Mesh(limbGeo, pantsMat);
        legL.position.set(0.25, 0.5, 0);
        legL.castShadow = true;
        player.add(legL);

        const legR = new THREE.Mesh(limbGeo, pantsMat);
        legR.position.set(-0.25, 0.5, 0);
        legR.castShadow = true;
        player.add(legR);

        // ==========================================
        // 7. Entities (Enemies, Items)
        // ==========================================
        const entitiesGroup = new THREE.Group();
        scene.add(entitiesGroup);

        function spawnEnemy() {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(0.3, 0.8, 0.61);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(-0.3, 0.8, 0.61);
            group.add(eyeL, eyeR);

            // Random position away from player
            let angle = Math.random() * Math.PI * 2;
            let radius = 20 + Math.random() * 10;
            group.position.set(player.position.x + Math.cos(angle)*radius, 0, player.position.z + Math.sin(angle)*radius);
            
            entitiesGroup.add(group);
            enemies.push(group);
        }

        function spawnItem(type) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshLambertMaterial({ 
                color: type === 'score' ? 0xff8c00 : 0xffea00,
                emissive: type === 'score' ? 0x442200 : 0x444400
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            let angle = Math.random() * Math.PI * 2;
            let radius = 5 + Math.random() * 20;
            mesh.position.set(Math.cos(angle)*radius, 1, Math.sin(angle)*radius);
            
            mesh.userData = { type: type, floatOffset: Math.random() * Math.PI * 2 };
            entitiesGroup.add(mesh);
            
            if(type === 'score') scoreBoxes.push(mesh);
            else questionBoxes.push(mesh);
        }

        // ==========================================
        // 8. Input Handling
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if(gameState !== 'playing') return;
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = true; targetPosition = null; break;
                case 's': case 'arrowdown': moveState.backward = true; targetPosition = null; break;
                case 'a': case 'arrowleft': moveState.left = true; targetPosition = null; break;
                case 'd': case 'arrowright': moveState.right = true; targetPosition = null; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': moveState.forward = false; break;
                case 's': case 'arrowdown': moveState.backward = false; break;
                case 'a': case 'arrowleft': moveState.left = false; break;
                case 'd': case 'arrowright': moveState.right = false; break;
            }
        });

        function handleTouchOrClick(e) {
            if(gameState !== 'playing') return;
            e.preventDefault();
            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Raycast to ground
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(groundPlane, intersectPoint);
            if(intersectPoint) {
                targetPosition = intersectPoint;
            }
        }

        window.addEventListener('mousedown', handleTouchOrClick);
        window.addEventListener('touchstart', handleTouchOrClick, {passive: false});
        window.addEventListener('mousemove', (e) => { if(e.buttons > 0) handleTouchOrClick(e); });
        window.addEventListener('touchmove', handleTouchOrClick, {passive: false});
        
        window.addEventListener('mouseup', () => targetPosition = null);
        window.addEventListener('touchend', () => targetPosition = null);

        // ==========================================
        // 9. UI Logic & Flow
        // ==========================================
        const DOM = {
            start: document.getElementById('start-screen'),
            gameover: document.getElementById('game-over-screen'),
            hud: document.getElementById('hud'),
            quiz: document.getElementById('quiz-modal'),
            homeConfirm: document.getElementById('home-modal'),
            score: document.getElementById('score-display'),
            stars: document.getElementById('stars-display'),
            nameInput: document.getElementById('input-name'),
            nameTag: document.getElementById('name-tag'),
            endTitle: document.getElementById('end-title'),
            endScore: document.getElementById('end-score'),
            endStars: document.getElementById('end-stars')
        };

        document.getElementById('btn-start').addEventListener('click', () => {
            playerName = DOM.nameInput.value.trim() || "Player";
            DOM.nameTag.innerText = playerName;
            startGame();
        });

        document.getElementById('btn-restart').addEventListener('click', startGame);

        document.getElementById('btn-home').addEventListener('click', () => {
            gameState = 'paused';
            DOM.homeConfirm.classList.remove('hidden');
        });

        document.getElementById('btn-home-no').addEventListener('click', () => {
            gameState = 'playing';
            DOM.homeConfirm.classList.add('hidden');
        });

        document.getElementById('btn-home-yes').addEventListener('click', () => {
            DOM.homeConfirm.classList.add('hidden');
            endGame(false);
        });

        function startGame() {
            SFX.start();
            score = 0;
            stars = 0;
            updateHUD();
            
            player.position.set(0, 0, 0);
            targetPosition = null;
            moveState = { forward: false, backward: false, left: false, right: false };
            
            // Clean entities
            enemies.forEach(e => entitiesGroup.remove(e));
            scoreBoxes.forEach(e => entitiesGroup.remove(e));
            questionBoxes.forEach(e => entitiesGroup.remove(e));
            enemies = []; scoreBoxes = []; questionBoxes = [];

            generateEnvironment();
            
            for(let i=0; i<3; i++) spawnEnemy();
            for(let i=0; i<5; i++) spawnItem('score');
            for(let i=0; i<3; i++) spawnItem('question');

            DOM.start.classList.add('hidden');
            DOM.gameover.classList.add('hidden');
            DOM.hud.classList.remove('hidden');
            DOM.nameTag.style.display = 'block';
            
            gameState = 'playing';
        }

        function endGame(isWin) {
            gameState = 'gameover';
            if(!isWin) SFX.gameover();
            else SFX.correct();

            DOM.hud.classList.add('hidden');
            DOM.nameTag.style.display = 'none';
            DOM.gameover.classList.remove('hidden');
            
            DOM.endTitle.innerText = isWin ? "You Win! 🎉" : "Caught!";
            DOM.endTitle.className = isWin ? "text-4xl font-extrabold text-green-500 mb-4" : "text-4xl font-extrabold text-red-600 mb-4";
            
            DOM.endScore.innerText = score;
            DOM.endStars.innerText = stars;
            DOM.gameover.querySelector('.border-4').className = isWin 
                ? "bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-green-500 modal-enter" 
                : "bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-red-600 modal-enter";
        }

        function updateHUD() {
            DOM.score.innerText = score;
            DOM.stars.innerText = stars;
            if(stars >= 10) endGame(true);
        }

        // ==========================================
        // 10. Quiz System
        // ==========================================
        function triggerQuiz() {
            gameState = 'paused';
            SFX.question();
            currentQuestion = questionBank[Math.floor(Math.random() * questionBank.length)];
            
            document.getElementById('quiz-question').innerText = currentQuestion.q;
            const choicesContainer = document.getElementById('quiz-choices');
            choicesContainer.innerHTML = '';
            
            currentQuestion.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-blue-100 hover:bg-blue-200 text-blue-900 font-bold py-3 px-4 rounded-lg border-2 border-blue-300 transition text-left";
                btn.innerText = choice;
                btn.onclick = () => handleAnswer(index, btn, choicesContainer);
                choicesContainer.appendChild(btn);
            });

            document.getElementById('quiz-feedback').classList.add('hidden');
            DOM.quiz.classList.remove('hidden');
        }

        function handleAnswer(selectedIndex, btnElement, container) {
            // Disable all buttons
            Array.from(container.children).forEach(btn => btn.disabled = true);
            
            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');

            if(selectedIndex === currentQuestion.answer) {
                // Correct
                SFX.correct();
                btnElement.classList.replace('bg-blue-100', 'bg-green-500');
                btnElement.classList.replace('text-blue-900', 'text-white');
                feedback.innerText = "Correct! +50 Pts, +1 Star ⭐";
                feedback.className = "mt-4 text-center font-bold text-xl h-8 text-green-500";
                score += 50;
                stars += 1;
            } else {
                // Wrong
                SFX.wrong();
                btnElement.classList.replace('bg-blue-100', 'bg-red-500');
                btnElement.classList.replace('text-blue-900', 'text-white');
                
                // Highlight correct
                const correctBtn = container.children[currentQuestion.answer];
                correctBtn.classList.replace('bg-blue-100', 'bg-green-500');
                correctBtn.classList.replace('text-blue-900', 'text-white');
                
                feedback.innerText = "Wrong!";
                feedback.className = "mt-4 text-center font-bold text-xl h-8 text-red-500";
            }
            
            updateHUD();

            // Wait 2 seconds then close
            setTimeout(() => {
                DOM.quiz.classList.add('hidden');
                spawnItem('question'); // Respawn a question box
                if(gameState !== 'gameover') gameState = 'playing';
            }, 2000);
        }

        // ==========================================
        // 11. Main Game Loop
        // ==========================================
        const clock = new THREE.Clock();
        
        function updatePlayer(dt) {
            const speed = 10;
            let isMoving = false;
            let dir = new THREE.Vector3();

            if(targetPosition) {
                // Move towards touch/click point
                const dist = player.position.distanceTo(targetPosition);
                if(dist > 0.5) {
                    dir.subVectors(targetPosition, player.position).normalize();
                    isMoving = true;
                } else {
                    targetPosition = null; // Reached
                }
            } else {
                // Keyboard movement
                if(moveState.forward) dir.z -= 1;
                if(moveState.backward) dir.z += 1;
                if(moveState.left) dir.x -= 1;
                if(moveState.right) dir.x += 1;
                
                if(dir.lengthSq() > 0) {
                    dir.normalize();
                    isMoving = true;
                }
            }

            if(isMoving) {
                player.position.addScaledVector(dir, speed * dt);
                
                // Rotate player towards movement direction smoothly
                const targetAngle = Math.atan2(dir.x, dir.z);
                let currentAngle = player.rotation.y;
                // Simple smooth rotation
                let diff = targetAngle - currentAngle;
                while(diff < -Math.PI) diff += Math.PI * 2;
                while(diff > Math.PI) diff -= Math.PI * 2;
                player.rotation.y += diff * 10 * dt;

                // Animate limbs (Swing)
                const time = clock.getElapsedTime();
                const swing = Math.sin(time * 15) * 0.8;
                armL.rotation.x = swing;
                armR.rotation.x = -swing;
                legL.rotation.x = -swing;
                legR.rotation.x = swing;
            } else {
                // Reset limbs
                armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, 0.1);
                armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, 0, 0.1);
                legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, 0.1);
                legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, 0.1);
            }

            // Update 2D Name Tag Position
            if(gameState === 'playing') {
                const tempV = new THREE.Vector3();
                tempV.copy(head.position);
                tempV.y += 1.5; // Offset above head
                player.localToWorld(tempV);
                tempV.project(camera);

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                DOM.nameTag.style.left = `${x}px`;
                DOM.nameTag.style.top = `${y}px`;
                // Hide if behind camera
                DOM.nameTag.style.opacity = tempV.z > 1 ? '0' : '1';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if(gameState === 'playing') {
                updatePlayer(dt);

                // Update Camera (Smooth Follow)
                const camOffset = new THREE.Vector3(0, 10, 15);
                const desiredCamPos = player.position.clone().add(camOffset);
                camera.position.lerp(desiredCamPos, 5 * dt);
                camera.lookAt(player.position);

                // Update Items (Float and Rotate)
                const time = clock.getElapsedTime();
                [...scoreBoxes, ...questionBoxes].forEach(box => {
                    box.rotation.y += 2 * dt;
                    box.position.y = 1 + Math.sin(time * 3 + box.userData.floatOffset) * 0.3;
                    
                    // Collision
                    if(player.position.distanceTo(box.position) < 2) {
                        entitiesGroup.remove(box);
                        if(box.userData.type === 'score') {
                            SFX.score();
                            score += 10;
                            updateHUD();
                            scoreBoxes = scoreBoxes.filter(b => b !== box);
                            spawnItem('score'); // Respawn
                        } else {
                            questionBoxes = questionBoxes.filter(b => b !== box);
                            triggerQuiz();
                        }
                    }
                });

                // Update Enemies
                enemies.forEach(enemy => {
                    // Look at player
                    enemy.lookAt(player.position);
                    // Move towards player slowly
                    const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                    enemy.position.addScaledVector(dir, 3 * dt); // Speed 3

                    // Enemy Collision (Game Over)
                    if(player.position.distanceTo(enemy.position) < 1.5) {
                        endGame(false);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate();
    </script>
</body>
